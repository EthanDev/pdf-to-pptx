name: Codex project human gates
on:
  pull_request:
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  codex-approvals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify human approval using protected base
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f trusted/.codex/quality-runtime/approvals.py ]; then
            echo 'Bootstrap only; hosted protection is pending human merge and reconciliation.'
            exit 0
          fi
          python3 trusted/.codex/quality-runtime/approvals.py --project candidate --policy trusted/.codex/quality-runtime/approval-policy.json --repo "$REPOSITORY" --pr "$PR_NUMBER"
