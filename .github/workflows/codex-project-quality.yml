name: Codex project checks
on: [pull_request]
permissions:
  contents: read
jobs:
  codex-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install -r requirements.lock
      - name: Run project checks
        run: python3 .codex/quality-runtime/checks.py
      - name: Test reviewed-contract compatibility
        if: ${{ hashFiles('.github/scripts/test_reviewed_contract.py') != '' }}
        run: python3 .github/scripts/test_reviewed_contract.py
